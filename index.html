<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click on the waffle.</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="assets/waffle.ico" type="image/x-icon">
</head>

<body>
    <div class="shop">
        <h2>Shop</h2>

        <div class="upgrade">
            <h3>Better Fork</h3>
            <p>+1 waffle per click</p>

            <p>
                Cost:
                <span id="fork-cost">25</span>
                waffles
            </p>

            <button id="fork-upgrade">Buy</button>
        </div>

        <div class="upgrade">
            <h3>Waffle Cooker</h3>
            <p>+1 waffle per second</p>

            <p>
                Cost:
                <span id="cooker-cost">100</span>
                waffles
            </p>

            <button id="cooker-upgrade">Buy</button>
        </div>

        <div class="fact-box">
            <h3>Waffle Fact</h3>

            <p id="fact">
                Discover something new!
            </p>

            <button id="fact-button">
                Get Fact
            </button>
        </div>
    </div>
    <h1>Click on the waffle.</h1>
    <p id="score">Waffles: 0</p>
    <div class="sprite">

        <img id="spr" src="assets/spr.png" alt="sprite" width="900">
    </div>
    <canvas id="canvas"></canvas>
</body>

<script src="js/script.js"></script>

</html>
